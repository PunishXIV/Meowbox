name: release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish meowbox/meowbox.csproj -c Release -p:Version=${{ github.ref_name }}

      - run: gh release create ${{ github.ref_name }} meowbox/bin/Release/net10.0-windows/win-x64/publish/meowbox.exe --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
